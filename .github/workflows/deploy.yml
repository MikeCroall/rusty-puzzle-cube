name: Deploy

on:
    workflow_call:

jobs:
    deploy-github-pages:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-slim
        permissions:
            id-token: write
            pages: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
