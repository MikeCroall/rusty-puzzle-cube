name: CI

on:
    push:
        paths-ignore: [".github/dependabot.yml", "**.md", "**.png"]
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
    contents: read

jobs:
    rust-build:
        uses: ./.github/workflows/rust-build.yml
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    web-build:
        uses: ./.github/workflows/web-build.yml

    success:
        name: Check success
        needs: [rust-build, web-build]
        if: always()
        runs-on: ubuntu-slim
        env:
            NEEDS: ${{ toJSON(needs) }}
        steps:
            - name: Print all results
              run: echo "$NEEDS"
            - name: Exit if any failures or cancellations
              if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
              run: exit 1

    deploy:
        needs: [success]
        if: github.ref_name == github.event.repository.default_branch
        uses: ./.github/workflows/deploy.yml
        permissions:
            id-token: write
            pages: write
